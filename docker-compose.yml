services:
  opencode-web:
    image: xorao/opencode-web:latest
    build: .
    container_name: opencode-web
    restart: unless-stopped
    ports:
      - "${OPENCODE_PORT:-7681}:7681"
    environment:
      - LANG=C.utf8
      - LC_ALL=C.utf8
      - LANGUAGE=C
      - TERM=xterm-256color
      - TTYD_AUTH=${TTYD_AUTH:-}
      - VOICE_GROQ_API_KEY=${VOICE_GROQ_API_KEY:-${GROQ_API_KEY:-}}
      - VOICE_GROQ_MODEL=${VOICE_GROQ_MODEL:-whisper-large-v3}
      - VOICE_LANGUAGE=${VOICE_LANGUAGE:-EN}
      - VOICE_TTS_PROVIDER=${VOICE_TTS_PROVIDER:-browser}
      - VOICE_CONVERSATION_PROMPT=${VOICE_CONVERSATION_PROMPT:-}
      - ENABLE_HTTPS=${ENABLE_HTTPS:-false}
      - AUTO_UPDATE=${AUTO_UPDATE:-true}
      - AUTO_START_OPENCODE=${AUTO_START_OPENCODE:-true}
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=256}
    volumes:
      - ./data/config:/root/.config/opencode
      - ./data/share:/root/.local/share/opencode
      - ./workspace:/workspace
      - ./server.js:/server.js
      - ./index.html:/usr/local/share/ttyd/index.html
      - ./entrypoint.sh:/entrypoint.sh
      - ./clipboard-helper.sh:/usr/local/bin/clipboard-helper
      - ./public:/public
    working_dir: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"

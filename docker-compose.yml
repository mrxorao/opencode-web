services:
  opencode-web:
    image: xorao/opencode-web:latest
    build: .
    container_name: opencode-web
    restart: unless-stopped
    ports:
      - "${OPENCODE_PORT:-7681}:7681"
    environment:
      - TTYD_AUTH=${TTYD_AUTH:-admin:admin123}
      - VOICE_GROQ_API_KEY=${VOICE_GROQ_API_KEY:-${GROQ_API_KEY:-}}
      - VOICE_LANGUAGE=${VOICE_LANGUAGE:-EN}
      - ENABLE_HTTPS=${ENABLE_HTTPS:-false}
      - AUTO_START_OPENCODE=true
      - NODE_OPTIONS=--max-old-space-size=256
    volumes:
      - ./data/config:/root/.config/opencode
      - ./data/share:/root/.local/share/opencode
      - ./workspace:/workspace
    working_dir: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="100" ry="100" fill="url(#bgGrad)" stroke="#30363d" stroke-width="6"/>
  <rect x="24" y="24" width="464" height="464" rx="92" ry="92" fill="url(#glowGrad)"/>

  <!-- Terminal Prompt > -->
  <path d="M120 160 L230 256 L120 352" fill="none" stroke="url(#accentGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- AI Voice Waves / Cursor -->
  <!-- Cursor underscore -->
  <line x1="260" y1="352" x2="390" y2="352" stroke="#58a6ff" stroke-width="34" stroke-linecap="round" filter="url(#glow)"/>

  <!-- AI Sparkle / Voice Rings at top right -->
  <circle cx="370" cy="180" r="14" fill="#7ee787" filter="url(#glow)"/>
  <line x1="370" y1="148" x2="370" y2="160" stroke="#7ee787" stroke-width="7" stroke-linecap="round"/>
  <line x1="370" y1="200" x2="370" y2="212" stroke="#7ee787" stroke-width="7" stroke-linecap="round"/>
  <line x1="338" y1="180" x2="350" y2="180" stroke="#7ee787" stroke-width="7" stroke-linecap="round"/>
  <line x1="390" y1="180" x2="402" y2="180" stroke="#7ee787" stroke-width="7" stroke-linecap="round"/>
</svg>
